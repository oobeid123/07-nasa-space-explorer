<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <!-- NASA's web design system uses Helvetica and Source Sans Pro (now "Source Sans 3" on Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="img/nasa-worm-logo.png" />
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <!-- LevelUp: random "Did You Know?" space fact, filled in by script.js -->
    <section class="fact-box" aria-live="polite">
      <h2>Did You Know?</h2>
      <p id="spaceFact"></p>
    </section>

    <div class="filters">
      <label class="date-field">
        <span>Start date</span>
        <input type="date" id="startDate" />
      </label>
      <label class="date-field">
        <span>End date</span>
        <input type="date" id="endDate" />
      </label>
      <button id="getImagesBtn">Get Space Images</button>
    </div>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <!-- Modal window: hidden until a gallery item is clicked -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <button id="modalClose" class="modal-close" aria-label="Close">&times;</button>
      <div id="modalMedia" class="modal-media"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalDate" class="modal-date"></p>
      <p id="modalExplanation" class="modal-explanation"></p>
    </div>
  </div>

  <footer class="site-footer">
    <p>Images and text from NASA's <a href="https://apod.nasa.gov/apod/astropix.html" target="_blank" rel="noopener">Astronomy Picture of the Day</a>, served by the <a href="https://api.nasa.gov/" target="_blank" rel="noopener">NASA APOD API</a> and <a href="https://science.nasa.gov/apod/" target="_blank" rel="noopener">NASA Science</a>.</p>
  </footer>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
